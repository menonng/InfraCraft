# 조합법 그림을 만든다: 마인크래프트·Create jar 의 텍스처로 그림을 그려 recipe-images 브랜치에 그림만 올린다.
# (jar 의 텍스처 파일 자체는 올리지 않는다) 결과는 docs/recipes 로 옮겨 커밋한다.
name: recipe-images
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "microsoft"
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x ./gradlew && ./gradlew :mc26.2:compileKotlin --dry-run -q || true
      - name: render
        run: |
          pip install --quiet pillow
          mkdir -p /tmp/jars
          curl -fsSL -o /tmp/jars/create.jar \
            https://api.modrinth.com/maven/maven/modrinth/create-fly/26.2-6.0.9-2/create-fly-26.2-6.0.9-2.jar
          mc=""
          for j in $(find ~/.gradle/caches -name "*.jar" -size +10M | grep -E "26\.2" | grep -viE "sources"); do
            if unzip -Z1 "$j" 2>/dev/null | grep -q '^assets/minecraft/items/stone.json'; then mc="$j"; break; fi
          done
          echo "minecraft jar: $mc"
          test -n "$mc"
          icons=$(ls common/resources/assets/infracraft/items | sed 's/\.json$//;s/^/infracraft:/' | tr '\n' ' ')
          python3 tools/recipes/render_recipes.py --jar "$mc" --jar /tmp/jars/create.jar --mod common/resources \
            --recipes versions/26.2/src/main/resources/data/infracraft/recipe --out /tmp/out \
            --icons $icons minecraft:written_book
      - name: push to recipe-images
        # 작업 폴더가 섞이지 않도록 결과 폴더만 따로 저장소로 만들어 올린다
        run: |
          url=$(git remote get-url origin)
          auth=$(git config --get http.https://github.com/.extraheader || true)
          cd /tmp/out
          git init -q -b recipe-images
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Recipe images"
          git -c http.https://github.com/.extraheader="$auth" push -f "$url" HEAD:recipe-images
