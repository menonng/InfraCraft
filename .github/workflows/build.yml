name: build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        mc: ["26.2", "26.3"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "microsoft"
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x ./gradlew
      - name: build
        run: |
          set -o pipefail
          ./gradlew :mc${{ matrix.mc }}:build 2>&1 | tee build.log
      - name: smoke test (dedicated server boots, then stops)
        run: |
          timeout 900 ./gradlew :mc${{ matrix.mc }}:runServer --stacktrace 2>&1 | tee server.log
          grep -q "\[InfraCraft\] smoke test passed" server.log
      - name: report errors as annotations
        if: failure()
        run: |
          cat build.log server.log 2>/dev/null \
            | grep -E "^e: |error:|\[ERROR\]|What went wrong|Caused by|Exception|Mixin.*(fail|error)|Unresolved|> .*failed" \
            | grep -vE "^\s*at " | sed -E 's#file:///home/runner/work/InfraCraft/InfraCraft/##; s#/home/runner/work/InfraCraft/InfraCraft/##' \
            | awk '!seen[$0]++' | head -80 | cut -c1-400 > errors.txt || true
          split -l 8 errors.txt chunk_ || true
          for c in chunk_*; do
            [ -f "$c" ] || continue
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' "$c")
            echo "::error title=${{ matrix.mc }}::$msg"
          done
      - name: report data and mixin warnings
        if: always()
        run: |
          [ -f server.log ] || exit 0
          grep -E "SMOKE|WARN|ERROR" server.log | grep -iE "infracraft|SMOKE|mixin|Couldn't|Failed to|Unknown|registry|tag" \
            | grep -vE "SMOKE OK" | sed -E 's/^.*\] //' | awk '!seen[$0]++' | head -80 | cut -c1-400 > warnings.txt || true
          split -l 8 warnings.txt wchunk_ || true
          for c in wchunk_*; do
            [ -f "$c" ] || continue
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' "$c")
            echo "::warning title=${{ matrix.mc }} runtime::$msg"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: infracraft-mc${{ matrix.mc }}
          path: versions/${{ matrix.mc }}/build/libs/

  # Create Fly(와 대표 애드온)를 함께 띄워 Create 연동(리플렉션, 트랙 블록)과 공존을 확인한다.
  #  - 26.2: 공식 Create Fly 26.2-6.0.9-2 + Steam 'n' Rails Fly(소스 빌드)
  #  - 26.3: 비공식 Create Fly 26.3 포트(소스 빌드)
  create-compat:
    strategy:
      fail-fast: false
      matrix:
        mc: ["26.2", "26.3"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "microsoft"
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x ./gradlew && mkdir -p versions/${{ matrix.mc }}/run/mods
      - name: Create Fly 26.2 (Modrinth) + Steam 'n' Rails Fly
        if: matrix.mc == '26.2'
        run: |
          set -o pipefail
          curl -fsSL -o versions/26.2/run/mods/create-fly-26.2-6.0.9-2.jar \
            https://api.modrinth.com/maven/maven/modrinth/create-fly/26.2-6.0.9-2/create-fly-26.2-6.0.9-2.jar
          git clone --depth 1 -b fabric-26.2 https://github.com/cat4blep/Create-Steam-n-Rails-Fly /tmp/snr
          (cd /tmp/snr && chmod +x gradlew && ./gradlew build -x test 2>&1 | tee /tmp/addon-build.log | tail -15)
          jar=$(find /tmp/snr -path "*build/libs/*.jar" | grep -vE "sources|dev|common" | head -1)
          echo "SnR jar: $jar"; cp "$jar" versions/26.2/run/mods/
          echo "INFRACRAFT_SMOKE_RAILWAYS=true" >> "$GITHUB_ENV"
      - name: Create Fly 26.3 (unofficial port, source build)
        if: matrix.mc == '26.3'
        run: |
          set -o pipefail
          git clone --depth 1 https://github.com/zedekvdb/create-fly-unofficial-port /tmp/createfly
          (cd /tmp/createfly && chmod +x gradlew && ./gradlew build -x test 2>&1 | tee /tmp/addon-build.log | tail -15)
          cp "$(ls /tmp/createfly/build/libs/*.jar | grep -vE 'sources|dev' | head -1)" versions/26.3/run/mods/
      - name: smoke test with Create
        env:
          INFRACRAFT_SMOKE_CREATE: "true"
        run: |
          ls versions/${{ matrix.mc }}/run/mods
          timeout 1200 ./gradlew :mc${{ matrix.mc }}:runServer 2>&1 | tee server.log
          grep -q "\[InfraCraft\] smoke test passed" server.log
      - name: report errors and warnings as annotations
        if: always()
        run: |
          cat /tmp/addon-build.log server.log 2>/dev/null \
            | grep -E "SMOKE|InfraCraft|^e: |error:|What went wrong|Caused by|Exception|Mixin.*(fail|error)|Incompatible mods|requires" \
            | grep -vE "SMOKE OK|^\s*at |^w: " | sed -E 's/^.*\] //' | awk '!seen[$0]++' | head -80 | cut -c1-400 > notes.txt || true
          split -l 8 notes.txt nchunk_ || true
          for c in nchunk_*; do
            [ -f "$c" ] || continue
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' "$c")
            echo "::warning title=create-compat ${{ matrix.mc }}::$msg"
          done
