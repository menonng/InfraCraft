name: build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        mc: ["1.21.1", "1.21.11", "26.3"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "microsoft"
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x ./gradlew
      - name: build
        run: ./gradlew :mc${{ matrix.mc }}:build --stacktrace
      - name: smoke test (dedicated server boots, then stops)
        run: |
          timeout 900 ./gradlew :mc${{ matrix.mc }}:runServer --stacktrace 2>&1 | tee server.log
          grep -q "\[InfraCraft\] smoke test passed" server.log
      - name: show InfraCraft warnings
        if: always()
        run: grep -iE "infracraft|mixin apply|Couldn't parse|Failed to (load|parse)" server.log | grep -iE "warn|error|fail|exception" | head -100 || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: infracraft-mc${{ matrix.mc }}
          path: versions/${{ matrix.mc }}/build/libs/
